name: Build and Test

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['21']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: gradle

      - name: Ensure gradle-antlr-plugin is available
        shell: bash
        run: |
          set -euo pipefail
          ROOT_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          OWNER="${GITHUB_REPOSITORY_OWNER}"

          if [ -d "$ROOT_PARENT/gradle-antlr-plugin/.git" ]; then
            echo "gradle-antlr-plugin already present"
            exit 0
          fi

          if git clone --depth 1 "https://github.com/$OWNER/gradle-antlr-plugin.git" "$ROOT_PARENT/gradle-antlr-plugin"; then
            echo "Cloned $OWNER/gradle-antlr-plugin"
            exit 0
          fi

          git clone --depth 1 "https://github.com/jurgenei/gradle-antlr-plugin.git" "$ROOT_PARENT/gradle-antlr-plugin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and verify samples
        run: |
          ./gradlew clean build --stacktrace
          ./gradlew verifySamples --stacktrace

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: jurgenei/gradle-antlr-sas-plugin

