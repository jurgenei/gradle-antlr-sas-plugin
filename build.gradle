import org.gradle.api.GradleException
import java.security.MessageDigest
plugins {
    id 'java'
    id 'antlr'
    id 'java-gradle-plugin'
    id 'jacoco'
    id 'org.flowdigger.gradle.antlr'
    id 'maven-publish'
    id 'signing'
}

group = 'org.flowdigger.gradle'
version = '0.1.2'

gradlePlugin {
    plugins {
        website = 'https://github.com/jurgenei/gradle-antlr-sas-plugin'
        vcsUrl = 'https://github.com/jurgenei/gradle-antlr-sas-plugin'
        sasGrammar {
            id = 'org.flowdigger.gradle.antlr.sas'
            implementationClass = 'org.flowdigger.gradle.antlr.SasGrammarPlugin'
            displayName = 'Gradle ANTLR SAS Plugin'
            description = 'Proof-of-concept SAS macro expansion and XML AST generation plugin.'
            tags.set(['antlr', 'sas', 'xml', 'ast', 'macro'])
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
}

dependencies {
    implementation 'org.flowdigger.gradle:gradle-antlr-plugin:0.1.7'
    implementation 'org.antlr:antlr4-runtime:4.13.2'

    antlr 'org.antlr:antlr4:4.13.2'

    testImplementation gradleTestKit()
    testImplementation 'junit:junit:4.13.2'
}

publishing {
    repositories {
        mavenLocal()
        maven {
            name = 'sonatype'
            def releasesRepoUrl = 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            def snapshotsRepoUrl = 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
            url = uri(version.toString().endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl)
            credentials {
                username = providers.gradleProperty('mavenCentralUsername').orNull
                password = providers.gradleProperty('mavenCentralPassword').orNull
            }
        }
    }

    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'Gradle ANTLR SAS Plugin'
                description = 'Gradle plugin for XML AST conversion of SAS sources'
                url = 'https://github.com/jurgenei/gradle-antlr-sas-plugin'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'jurgenei'
                        name = 'Jurgen Hildebrand'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/jurgenei/gradle-antlr-sas-plugin.git'
                    developerConnection = 'scm:git:ssh://git@github.com/jurgenei/gradle-antlr-sas-plugin.git'
                    url = 'https://github.com/jurgenei/gradle-antlr-sas-plugin'
                }
            }
        }
    }

    repositories {
        mavenLocal()
    }
}

generateGrammarSource {
    arguments += ['-listener', '-no-visitor']
}

sourceSets {
    main {
        antlr {
            srcDirs = ['src/main/antlr/org/flowdigger/parsers']
            include 'SasLexer.g4'
            include 'SasParser.g4'
            include 'CaslLexer.g4'
            include 'CaslParser.g4'
            include 'FedSqlLexer.g4'
            include 'FedSqlParser.g4'
            include 'Ds2Lexer.g4'
            include 'Ds2Parser.g4'
        }
        resources {
            srcDir 'src/main/antlr'
            include '**/*.g4'
        }
    }
}

tasks.named('javadoc', Javadoc) {
    source = fileTree('src/main/java') {
        include '**/*.java'
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateGrammarSource')
}

tasks.named('test') {
    useJUnit()
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('verifySampleSas', Exec) {
    group = 'verification'
    description = 'Runs SAS sample macro and XML AST tasks.'
    workingDir = projectDir
    commandLine './gradlew', '-p', 'samples/sas', 'clean', 'sasMacro', 'sasXmlAst'
}

tasks.register('verifySampleCasl', Exec) {
    group = 'verification'
    description = 'Runs CASL sample XML AST and semantic tasks.'
    workingDir = projectDir
    commandLine './gradlew', '-p', 'samples/casl', 'clean', 'caslXmlAst', 'caslSemantic'
}

tasks.register('verifySampleDs2', Exec) {
    group = 'verification'
    description = 'Runs DS2 sample XML AST and semantic tasks.'
    workingDir = projectDir
    commandLine './gradlew', '-p', 'samples/ds2', 'clean', 'ds2XmlAst', 'ds2Semantic'
}

tasks.register('verifySamples') {
    group = 'verification'
    description = 'Runs all sample verification task chains.'
    dependsOn tasks.named('verifySampleSas')
    dependsOn tasks.named('verifySampleCasl')
    dependsOn tasks.named('verifySampleDs2')
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}


signing {
    def signingKey = providers.gradleProperty('signingKey').orNull
    def signingPassword = providers.gradleProperty('signingPassword').orNull
    def signingKeyId = providers.gradleProperty('signingKeyId').orNull

    if (signingKey && signingPassword) {
        if (signingKeyId) {
            useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
        } else {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
    } else {
        useGpgCmd()
    }

    sign publishing.publications
}


def centralArtifactId = (project.findProperty('mavenArtifactId') ?: project.name).toString()
def centralGroupPath = project.group.toString().replace('.', '/')

def stageCentralBundleRepo = tasks.register('stageCentralBundleRepo', Sync) {
    dependsOn tasks.named('publishToMavenLocal')

    def artifactBaseDir = file("${System.getProperty('user.home')}/.m2/repository/${centralGroupPath}/${centralArtifactId}")
    def artifactVersionDir = file("${artifactBaseDir}/${project.version}")
    from(artifactVersionDir)
    into(layout.buildDirectory.dir("central-staging-repo/${centralGroupPath}/${centralArtifactId}/${project.version}"))

    doFirst {
        if (!artifactVersionDir.exists()) {
            throw new GradleException("Expected local Maven artifact version directory not found: ${artifactVersionDir}")
        }
    }
}

def generateCentralBundleChecksums = tasks.register('generateCentralBundleChecksums') {
    dependsOn stageCentralBundleRepo
    notCompatibleWithConfigurationCache('Generates checksum files by scanning staged output directory at execution time.')

    doLast {
        def stagedVersionDir = layout.buildDirectory.dir("central-staging-repo/${centralGroupPath}/${centralArtifactId}/${project.version}").get().asFile
        if (!stagedVersionDir.exists()) {
            throw new GradleException("Expected staged version directory not found: ${stagedVersionDir}")
        }

        def checksum = { File input, String algorithm ->
            MessageDigest digest = MessageDigest.getInstance(algorithm)
            input.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = stream.read(buffer)) >= 0) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().collect { String.format('%02x', it & 0xff) }.join('')
        }

        stagedVersionDir.eachFileRecurse { file ->
            if (file.isFile() && !file.name.endsWith('.md5') && !file.name.endsWith('.sha1')) {
                file.parentFile.toPath().resolve(file.name + '.md5').toFile().text = checksum(file, 'MD5') + System.lineSeparator()
                file.parentFile.toPath().resolve(file.name + '.sha1').toFile().text = checksum(file, 'SHA-1') + System.lineSeparator()
            }
        }
    }
}

tasks.register('packageCentralBundle', Zip) {
    dependsOn generateCentralBundleChecksums
    archiveBaseName = project.name
    archiveVersion = project.version.toString()
    archiveClassifier = 'central-bundle'
    destinationDirectory = layout.buildDirectory.dir('central-bundle').get().asFile
    from layout.buildDirectory.dir('central-staging-repo')
}
