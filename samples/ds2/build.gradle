plugins {
    id 'java'
    id 'org.flowdigger.gradle.antlr.sas'
}

tasks.named('ds2XmlAst', org.flowdigger.gradle.antlr.XmlAstDs2GradleTask) {
    sourceDirectory.set(layout.projectDirectory.dir('src/main/ds2'))
    destinationDirectory.set(layout.buildDirectory.dir('output/ds2/xmlast'))
    targetExtension.set('.xml')
}

tasks.register('ds2XirAst', org.flowdigger.gradle.antlr.XmlAstDs2GradleTask) {
    sourceDirectory.set(layout.projectDirectory.dir('src/main/ds2'))
    destinationDirectory.set(layout.buildDirectory.dir('output/ds2/xmlast'))
    targetExtension.set('.xir')
    xirFormat.set('beautified')
}

tasks.named('ds2Semantic', org.flowdigger.gradle.antlr.Ds2SemanticExtractGradleTask) {
    sourceDirectory.set(layout.projectDirectory.dir('src/main/ds2'))
    destinationDirectory.set(layout.buildDirectory.dir('output/ds2/semantic'))
}

