plugins {
    id 'java'
    id 'org.flowdigger.gradle.antlr.sas'
}

tasks.named('caslXmlAst', org.flowdigger.gradle.antlr.XmlAstCaslGradleTask) {
    sourceDirectory.set(layout.projectDirectory.dir('src/main/casl'))
    destinationDirectory.set(layout.buildDirectory.dir('output/casl/xmlast'))
    targetExtension.set('.xml')
}

tasks.register('caslXirAst', org.flowdigger.gradle.antlr.XmlAstCaslGradleTask) {
    sourceDirectory.set(layout.projectDirectory.dir('src/main/casl'))
    destinationDirectory.set(layout.buildDirectory.dir('output/casl/xmlast'))
    targetExtension.set('.xir')
    xirFormat.set('beautified')
}

tasks.named('caslSemantic', org.flowdigger.gradle.antlr.CaslSemanticExtractGradleTask) {
    sourceDirectory.set(tasks.named('caslXmlAst', org.flowdigger.gradle.antlr.XmlAstCaslGradleTask)
            .flatMap { it.destinationDirectory })
    caslSourceDirectory.set(tasks.named('caslXmlAst', org.flowdigger.gradle.antlr.XmlAstCaslGradleTask)
            .flatMap { it.sourceDirectory })
    destinationDirectory.set(layout.buildDirectory.dir('output/casl/semantic'))
}

